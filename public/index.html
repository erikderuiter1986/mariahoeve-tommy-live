<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariahoeve Housekeeping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-900:#123324;
    --forest-700:#1f4a34;
    --forest-500:#2f7a4f;
    --moss-400:#7ec488;
    --stone-100:#eef4ec;
    --stone-050:#f8fbf6;
    --sky-500:#4a9bc7;
    --sky-600:#3a84ac;
    --lavender-500:#8a6fc2;
    --teal-500:#2e9e8f;
    --coral-500:#e2574c;
    --amber-500:#f0a83e;
    --leaf-400:#8fcf6f;
    --leaf-600:#3fa34a;
    --ink-900:#1c1c18;
    --ink-500:#5c584d;
    --line:#ddd6c4;
    --white:#ffffff;
    --radius:14px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Work Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--stone-100);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
    background:var(--stone-050);
    display:flex;
    flex-direction:column;
  }
  header.top{
    background:var(--forest-900);
    color:var(--stone-050);
    padding:22px 20px 0 20px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .brand-mark{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .logo-mark{
    display:block;
    height:56px;
    width:auto;
  }
  .brand .sub{
    font-size:12px;
    color:var(--moss-400);
    text-transform:uppercase;
    letter-spacing:1.4px;
    margin-top:6px;
  }
  .date-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:16px 0 0 0;
    gap:8px;
  }
  .date-nav button.arrow{
    background:rgba(255,255,255,0.08);
    border:none;
    color:var(--stone-050);
    width:36px;height:36px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  .date-nav button.arrow:hover{background:rgba(255,255,255,0.16);}
  .date-label{
    text-align:center;
    flex:1;
  }
  .date-label .day{font-family:var(--font-display); font-size:19px; font-weight:600;}
  .date-label .today-pill{
    display:inline-block;
    font-size:10px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    background:var(--amber-500);
    color:var(--forest-900);
    padding:2px 9px;
    border-radius:60% 40% 55% 45% / 45% 55% 40% 60%;
    margin-left:8px;
    vertical-align:middle;
    font-weight:700;
  }
  .summary-strip{
    display:flex;
    gap:10px;
    margin:16px 0 0 0;
    padding-bottom:14px;
  }
  .chip{
    flex:1;
    background:rgba(255,255,255,0.06);
    border-radius:10px;
    padding:8px 10px;
    text-align:center;
  }
  .chip b{display:block; font-size:18px; font-family:var(--font-display);}
  .chip span{font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--moss-400);}
  nav.tabs{
    display:flex;
    background:var(--forest-700);
    padding:0 12px;
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color:rgba(255,255,255,0.55);
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    padding:12px 4px;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active{
    color:var(--stone-050);
    border-bottom-color:var(--amber-500);
  }
  main{
    flex:1;
    padding:16px;
    padding-bottom:80px;
  }
  .empty{
    text-align:center;
    color:var(--ink-500);
    padding:60px 20px;
    font-size:14px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .card-title{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .card-title .name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status-dot{
    width:11px;height:9px;
    border-radius:60% 40% 55% 45% / 45% 55% 40% 60%;
    flex-shrink:0;
    transition:transform 0.2s ease;
  }
  @keyframes popDone{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.6); }
    60%{ transform:scale(0.9); }
    100%{ transform:scale(1); }
  }
  .status-dot.pop{
    animation:popDone 0.45s ease;
  }
  .status-btn{
    transition:transform 0.15s ease;
  }
  .status-btn.pop{
    animation:popDone 0.45s ease;
  }
  .dot-todo{background:var(--coral-500);}
  .dot-bezig{background:var(--amber-500);}
  .dot-klaar{background:var(--leaf-400);}
  .dot-gecheckt{background:var(--leaf-600);}
  .arrival-row{
    display:flex;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .arrival-btn{
    border:1px solid var(--line);
    background:var(--stone-100);
    color:var(--ink-500);
    font-size:11px;
    font-weight:600;
    padding:5px 9px;
    border-radius:8px;
    cursor:pointer;
  }
  .arrival-btn.on{
    background:var(--sky-500);
    border-color:var(--sky-500);
    color:var(--white);
  }
  .linen-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:8px;
  }
  .linen-label{
    font-size:11px;
    color:var(--ink-500);
    font-weight:600;
  }
  .linen-btns{
    display:flex;
    gap:5px;
  }
  .linen-btn{
    border:1px solid var(--line);
    background:var(--stone-050);
    color:var(--ink-500);
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .linen-btn.linen-ja.on{
    background:var(--leaf-600);
    border-color:var(--leaf-600);
    color:var(--white);
  }
  .linen-btn.linen-nee.on{
    background:var(--coral-500);
    border-color:var(--coral-500);
    color:var(--white);
  }
  .linen-btn.linen-onbekend.on{
    background:#c7c0ab;
    border-color:#c7c0ab;
    color:var(--ink-900);
  }
  .lock-hint{
    font-size:11px;
    color:var(--ink-500);
    font-style:italic;
    margin-top:4px;
  }
  .note-display{
    font-size:14px;
    font-weight:700;
    color:var(--ink-900);
    background:var(--stone-100);
    border-left:4px solid var(--amber-500);
    border-radius:10px;
    padding:9px 12px;
    margin-top:8px;
    line-height:1.4;
  }
  .row2{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  select, .note-input{
    width:100%;
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 9px;
    font-family:var(--font-body);
    font-size:13px;
    background:var(--stone-050);
    color:var(--ink-900);
  }
  .status-row{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .status-btn{
    flex:1;
    border:1px solid var(--line);
    background:var(--stone-050);
    padding:8px 4px;
    border-radius:9px;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-500);
  }
  .status-btn.active-todo{background:var(--coral-500); border-color:var(--coral-500); color:var(--white);}
  .status-btn.active-bezig{background:var(--amber-500); border-color:var(--amber-500); color:var(--white);}
  .status-btn.active-klaar{background:var(--leaf-400); border-color:var(--leaf-400); color:var(--forest-900);}
  .status-btn.active-gecheckt{background:var(--leaf-600); border-color:var(--leaf-600); color:var(--white);}
  .changed-line{
    font-size:11px;
    color:var(--ink-500);
    margin-top:6px;
  }
  .note-toggle{
    margin-top:8px;
    font-size:11px;
    color:var(--ink-500);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
  }
  .note-input{margin-top:8px;}
  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-500);
    margin:18px 0 8px 2px;
    font-weight:700;
  }
  .section-label:first-child{margin-top:0;}
  .team-list{list-style:none; padding:0; margin:0;}
  .team-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    font-weight:600;
  }
  .team-list li button{
    background:none;
    border:none;
    color:var(--sky-600);
    font-size:12px;
    cursor:pointer;
    font-weight:600;
  }
  .add-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .add-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 10px;
    font-family:var(--font-body);
    font-size:13px;
  }
  .add-row button{
    background:var(--forest-700);
    color:var(--white);
    border:none;
    border-radius:9px;
    padding:9px 16px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .item-remove{
    background:none;
    border:none;
    color:var(--ink-500);
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
    flex-shrink:0;
  }
  .accom-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
  }
  .loading, .savewarn{
    text-align:center;
    padding:16px;
    color:var(--ink-500);
    font-size:13px;
  }
  .timeline-heading{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-500);
    font-weight:700;
    margin:18px 2px 8px 2px;
  }
  .timeline-heading:first-child{margin-top:0;}
  .timeline-hint{
    text-transform:none;
    letter-spacing:0;
    font-weight:400;
    font-style:italic;
  }
  .timeline-heading-muted{
    color:#a9a290;
  }
  .timeline-muted-group{
    opacity:0.6;
  }
  .quick-sync-row{
    margin-bottom:12px;
    display:flex;
    gap:8px;
  }
  .quick-sync-btn{
    flex:1;
    background:var(--sky-500);
    color:var(--white);
    border:none;
    border-radius:10px;
    padding:10px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .live-sync-btn{
    background:var(--leaf-600);
  }
  .mytasks-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:14px;
    font-size:14px;
  }
  #myNamePicker li{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
  }
  #myNamePicker li:hover{
    border-color:var(--sky-500);
  }
  .prognose-row-clickable{
    cursor:pointer;
  }
  .prognose-row-clickable:hover{
    border-color:var(--sky-500);
  }
  .prognose-detail{
    background:var(--stone-100);
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 var(--radius) var(--radius);
    margin:-10px 0 8px 0;
    padding:6px 14px 10px 14px;
  }
  .prognose-detail-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .prognose-detail-list li{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .prognose-detail-list li:last-child{
    border-bottom:none;
  }
  .prognose-detail-name{
    font-weight:600;
    min-width:110px;
  }
  .prognose-detail-meta{
    color:var(--ink-500);
    font-size:12px;
  }
  .prognose-row{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
  }
  .prognose-day{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    row-gap:4px;
  }
  .prognose-empty{
    font-size:12px;
    color:var(--ink-500);
  }
  .prognose-badges{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .prognose-badges .badge{
    font-size:11px;
  }
  .badge-todo{background:var(--coral-500); color:var(--white);}
  .badge-klaar{background:var(--leaf-400); color:var(--forest-900);}
  .badge-gecheckt{background:var(--leaf-600); color:var(--white);}
  .sync-intro{
    font-size:13px;
    color:var(--ink-500);
    line-height:1.5;
    margin-bottom:14px;
  }
  .sync-box{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }
  .sync-box textarea{
    width:100%;
    min-height:110px;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 10px;
    font-family:monospace;
    font-size:11px;
    background:var(--stone-050);
    color:var(--ink-900);
    resize:vertical;
  }
  .sync-box input[type=file]{
    font-size:12px;
    margin-bottom:10px;
  }
  .sync-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .sync-actions button{
    background:var(--forest-700);
    color:var(--white);
    border:none;
    border-radius:9px;
    padding:9px 14px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .sync-actions button.secondary{
    background:var(--stone-100);
    color:var(--ink-900);
    border:1px solid var(--line);
  }
  .match-list{list-style:none; padding:0; margin:10px 0 0 0;}
  .match-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .match-list li:last-child{border-bottom:none;}
  .badge{
    font-size:10px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .badge-a{background:var(--sky-500); color:var(--white);}
  .badge-v{background:var(--lavender-500); color:var(--white);}
  .badge-w{background:var(--amber-500); color:var(--white);}
  .status-badge-todo{background:var(--coral-500); color:var(--white);}
  .status-badge-klaar{background:var(--leaf-400); color:var(--forest-900);}
  .status-badge-gecheckt{background:var(--leaf-600); color:var(--white);}
  .unmatched{
    font-size:12px;
    color:var(--ink-500);
    margin-top:10px;
    line-height:1.6;
  }
  @media (max-width:820px){
    .desktop-only-tab{
      display:none;
    }
    .quick-sync-row{
      display:none;
    }
    #lockToggle{
      display:none;
    }
  }
  @media (min-width:821px){
    .mobile-only-tab{
      display:none;
    }
  }
  .app-footer{
    text-align:center;
    padding:22px 0 30px 0;
  }
  .footer-logo{
    height:52px;
    width:auto;
    opacity:0.85;
  }
  .toast{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:var(--forest-900);
    color:var(--stone-050);
    padding:10px 18px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    transition:opacity 0.25s;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;}
  @media (max-width:420px){
    .status-btn{font-size:10px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function isToday(d){ return dateKey(d) === dateKey(new Date()); }
function dayLabelText(d){
  const days = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
  const months = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  return days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()];
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

// --- Verbinding met de eigen backend (dezelfde Render dienst als de Tommy koppeling) ---
// Het adres en de sleutel worden per apparaat onthouden met localStorage, dat is een
// gewone browserfunctie en werkt overal, ook buiten Claude's eigen weergave.
const DEFAULT_API_URL = "https://mariahoeve-tommy-live.onrender.com";
const DEFAULT_API_KEY = "Papenvoort2!";

function getApiUrl(){
  return (localStorage.getItem("mh_api_url") || DEFAULT_API_URL).replace(/\/$/, "");
}
function getApiKey(){
  return DEFAULT_API_KEY;
}
function setApiSettings(url, key){
  localStorage.setItem("mh_api_url", url || DEFAULT_API_URL);
  localStorage.setItem("mh_api_key", key || "");
}

async function loadList(key, fallback){
  try{
    const res = await fetch(`${getApiUrl()}/data/${encodeURIComponent(key)}?key=${encodeURIComponent(getApiKey())}`);
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data.value !== null && data.value !== undefined) ? data.value : fallback;
  }catch(e){ return fallback; }
}
async function saveList(key, value){
  try{
    const res = await fetch(`${getApiUrl()}/data/${encodeURIComponent(key)}?key=${encodeURIComponent(getApiKey())}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ value })
    });
    if(!res.ok){ showToast("Opslaan mislukt, controleer de Admin instellingen"); }
  }catch(e){ showToast("Kon de server niet bereiken"); }
}
async function loadAllDays(){
  return await loadList("all-days", {});
}
function pruneAllDays(){
  const keep = {};
  const base = new Date(state.currentDate);
  for(let i=-14;i<=45;i++){
    const d = new Date(base);
    d.setDate(d.getDate()+i);
    const k = dateKey(d);
    if(state.allDays[k]) keep[k] = state.allDays[k];
  }
  state.allDays = keep;
}
let _persistTimer = null;
let _persistInFlight = false;
let _persistQueued = false;
function persistAllDays(){
  if(_persistTimer) clearTimeout(_persistTimer);
  _persistTimer = setTimeout(()=>{ doPersistAllDays(); }, 500);
}
async function doPersistAllDays(attempt){
  attempt = attempt || 1;
  if(_persistInFlight){ _persistQueued = true; return; }
  _persistInFlight = true;
  try{
    pruneAllDays();
    const url = `${getApiUrl()}/data/all-days?key=${encodeURIComponent(getApiKey())}`;
    const res = await fetch(url, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ value: state.allDays })
    });
    if(!res.ok){
      if(attempt < 3){
        setTimeout(()=>doPersistAllDays(attempt+1), 700 * attempt);
      } else {
        showToast(`Opslaan is niet gelukt (status ${res.status}), controleer de Admin instellingen`);
      }
    }
  }catch(e){
    if(attempt < 3){
      setTimeout(()=>doPersistAllDays(attempt+1), 700 * attempt);
    } else {
      showToast("Opslaan mislukt: kon de server niet bereiken");
    }
  }finally{
    _persistInFlight = false;
    if(_persistQueued){
      _persistQueued = false;
      doPersistAllDays();
    }
  }
}
function loadDay(key){
  return state.allDays[key] || {};
}
function saveDay(key, value){
  state.allDays[key] = value;
  return persistAllDays();
}

function getEntry(id){
  return state.dayData[id] || { arrival:"", assignee:"", status:"todo", note:"", linen:"onbekend" };
}
function setEntry(id, patch){
  const cur = getEntry(id);
  state.dayData[id] = Object.assign({}, cur, patch);
  saveDay(dateKey(state.currentDate), state.dayData);
  renderSummary();
}

async function init(){
  if(!getApiKey()){
    renderConnectionSetup();
    return;
  }
  state.currentTab = window.matchMedia("(min-width:821px)").matches ? "accom" : "mytasks";
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const activeBtn = document.querySelector(`.tab-btn[data-tab="${state.currentTab}"]`);
  if(activeBtn) activeBtn.classList.add('active');
  const [accommodations, fixedTasks, staff, allDays, managerPin] = await Promise.all([
    loadList("accommodations", DEFAULT_ACCOMMODATIONS),
    loadList("fixed-tasks", DEFAULT_FIXED_TASKS),
    loadList("staff", DEFAULT_STAFF),
    loadAllDays(),
    loadList("manager-pin", "0000")
  ]);
  state.accommodations = accommodations;
  state.fixedTasks = fixedTasks;
  state.staff = staff;
  state.allDays = allDays;
  state.managerPin = managerPin || "0000";
  state.dayData = loadDay(dateKey(state.currentDate));
  render();
}

function renderConnectionSetup(){
  document.getElementById('main').innerHTML = `
    <div class="sync-box" style="margin-top:20px;">
      <div class="section-label" style="margin-top:0;">Eenmalige instelling voor dit toestel</div>
      <div class="sync-intro" style="margin-bottom:10px;">
        Dit toestel heeft nog geen verbinding met de server. Vul het adres en de toegangssleutel in, vraag deze na bij je bedrijfsleider als je ze niet hebt. Dit hoef je op dit toestel maar één keer te doen.
      </div>
      <input type="text" id="setupUrl" placeholder="https://mariahoeve-tommy-live.onrender.com" value="${escapeAttr(DEFAULT_API_URL)}" style="width:100%; margin-bottom:8px; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:13px;">
      <input type="text" id="setupKey" placeholder="Toegangssleutel" style="width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:13px;">
      <div class="sync-actions">
        <button id="setupSaveBtn">Verbinden</button>
      </div>
    </div>
  `;
  document.getElementById('setupSaveBtn').addEventListener('click', async ()=>{

      showToast("Vul een toegangssleutel in");

async function switchDay(offset){
  const d = new Date(state.currentDate);
  d.setDate(d.getDate()+offset);
  state.currentDate = d;
  document.getElementById('main').innerHTML = '<div class="loading">Bezig met laden…</div>';
  state.dayData = await loadDay(dateKey(state.currentDate));
  render();
}

function render(){
  document.getElementById('dayLabel').innerHTML =
    dayLabelText(state.currentDate) + (isToday(state.currentDate) ? '<span class="today-pill">Vandaag</span>' : '');
  renderSummary();

function renderSummary(){
  const ids = state.accommodations.map(n=>"accom:"+n).concat(state.fixedTasks.map(n=>"fixed:"+n));
  let counts = {todo:0, klaar:0, gecheckt:0};
  ids.forEach(id=>{
    const e = getEntry(id);
    counts[e.status] = (counts[e.status]||0)+1;

  strip.innerHTML = `
    <div class="chip"><b>${counts.todo}</b><span>Te doen</span></div>
    <div class="chip"><b>${counts.klaar}</b><span>Klaar</span></div>
    <div class="chip"><b>${counts.gecheckt}</b><span>Gecheckt</span></div>

function statusDotClass(status){
  return {todo:"dot-todo", klaar:"dot-klaar", gecheckt:"dot-gecheckt"}[status] || "dot-todo";
}

function renderMain(){
  const main = document.getElementById('main');
  if(state.currentTab === "accom"){
    if(state.accommodations.length === 0){
      main.innerHTML = '<div class="empty">Nog geen accommodaties toegevoegd. Ga naar Team om de lijst te beheren.</div>';
      return;
    }
    main.innerHTML = '<div class="quick-sync-row"><button id="liveSyncBtn" class="quick-sync-btn live-sync-btn">Ververs live</button></div>' +
      renderTimelineGroups();
  } else if(state.currentTab === "mytasks"){
    renderMyTasksTab(main);
    return;
  } else if(state.currentTab === "prognose"){
    renderPrognoseTab(main);
    return;
  } else if(state.currentTab === "fixed"){
    if(state.fixedTasks.length === 0){
      main.innerHTML = '<div class="empty">Geen vaste taken ingesteld.</div>';
      return;
    }
    main.innerHTML = state.fixedTasks.map(name=>renderItemCard("fixed", name)).join("");
  } else if(state.currentTab === "team"){
    renderTeamTab(main);
    return;
  } else if(state.currentTab === "admin"){
    renderAdminTab(main);
    return;
  }
  attachItemHandlers();

function formatChangedAt(iso){
  try{
    const d = new Date(iso);
    const now = new Date();
    const isSameDay = dateKey(d) === dateKey(now);
    const time = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if(isSameDay) return "vandaag " + time;
    const months = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
    return d.getDate() + " " + months[d.getMonth()] + " " + time;
  }catch(e){ return ""; }
}

function renderNoteSection(id, e, showNote){
  if(state.managerUnlocked){
    return `
      <button class="note-toggle" data-id="${escapeAttr(id)}" data-action="toggle-note">${showNote ? 'Notitie verbergen' : (e.note ? 'Notitie bekijken' : '+ Notitie toevoegen')}</button>
      ${showNote ? `<input class="note-input" data-id="${escapeAttr(id)}" data-action="note" placeholder="Bijvoorbeeld: vochtige dekens, extra kaars nodig" value="${escapeAttr(e.note||'')}">` : ""}
    `;
  }
  if(e.note){
    return `<div class="note-display">📝 ${escapeHtml(e.note)}</div>`;
  }
  return "";
}

function renderItemCard(kind, name){
  const id = kind+":"+name;
  const e = getEntry(id);
  const showNote = !!state.openNotes[id] || (e.note && e.note.length>0);
  const staffOptions = ['<option value="">Toewijzen…</option>'].concat(
    state.staff.map(s=>`<option value="${escapeHtml(s)}" ${e.assignee===s?'selected':''}>${escapeHtml(s)}</option>`)
  ).join("");
  const arrivalBtns = kind === "accom" ? `
    <div class="arrival-row">
      ${ARRIVAL_CODES.filter(a=>a.code).map(a=>`
        <button class="arrival-btn ${e.arrival===a.code?'on':''}" data-id="${escapeAttr(id)}" data-arrival="${a.code}">${a.label}</button>
      `).join("")}
    </div>` : "";
  const linenBtns = kind === "accom" ? `
    <div class="linen-row">
      <span class="linen-label">Linnen & handdoeken</span>
      <div class="linen-btns">
        ${LINEN_OPTIONS.map(l=>`
          <button class="linen-btn linen-${l.code} ${(e.linen||'onbekend')===l.code?'on':''}" data-id="${escapeAttr(id)}" data-linen="${l.code}">${l.label}</button>
        `).join("")}
      </div>
    </div>` : "";
  const statusBtns = STATUSES.map(s=>`
    <button class="status-btn ${e.status===s.key?'active-'+s.key:''}" data-id="${escapeAttr(id)}" data-status="${s.key}">${s.label}</button>
  `).join("");
  const changedLine = e.changedBy ? `<div class="changed-line">Laatst gewijzigd door ${escapeHtml(e.changedBy)}${e.changedAt ? ', ' + formatChangedAt(e.changedAt) : ''}</div>` : "";
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">
          <span class="status-dot ${statusDotClass(e.status)}"></span>
          <span class="name">${escapeHtml(name)}</span>
        </div>
      </div>
      ${arrivalBtns}
      ${linenBtns}
      <div class="row2">
        <select data-id="${escapeAttr(id)}" class="assignee-select" ${state.managerUnlocked ? '' : 'disabled'}>${staffOptions}</select>
      </div>
      ${!state.managerUnlocked ? '<div class="lock-hint">Vergrendeld, tik op het slotje bovenin om toe te wijzen</div>' : ''}
      <div class="status-row">${statusBtns}</div>
      ${changedLine}
      ${renderNoteSection(id, e, showNote)}
    </div>
  `;
}

function renderPrognoseTab(main){
  const dayNames = ["zo","ma","di","wo","do","vr","za"];
  const months = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  const codeLabel = { W:"Wissel", V:"Vertrek", LU:"Vertrek (late uitcheck)", A:"Aankomst", VI:"Aankomst (vroege incheck)" };
  const statusLabelMap = { todo:"Schoonmaak", klaar:"Klaar", gecheckt:"Gecheckt" };
  let html = '<div class="quick-sync-row"><button id="prognoseLiveSyncBtn" class="quick-sync-btn live-sync-btn">Ververs live</button></div>';
  html += `<div class="sync-intro" style="margin-bottom:14px;">Vooruitblik voor de komende tien dagen: hoeveel accommodaties aankomst, vertrek of wissel hebben. Klik op een dag voor de details.</div>`;
  for(let i=0;i<10;i++){
    const d = new Date(state.currentDate);
    d.setDate(d.getDate()+i);
    const dKey = dateKey(d);
    const dayData = state.allDays[dKey] || {};
    let counts = { aankomst:0, vertrek:0, wissel:0 };
    const items = [];
    state.accommodations.forEach(name=>{
      const e = dayData["accom:"+name];
      if(!e || !e.arrival) return;
      let sortOrder;
      if(e.arrival === "W"){ counts.wissel++; sortOrder = 1; }
      else if(e.arrival === "V" || e.arrival === "LU"){ counts.vertrek++; sortOrder = 2; }
      else if(e.arrival === "A" || e.arrival === "VI"){ counts.aankomst++; sortOrder = 0; }
      items.push({
        name,
        sortOrder,
        codeText: codeLabel[e.arrival] || e.arrival,
        assignee: e.assignee || "Nog niet toegewezen",
        statusKey: e.status || "todo",
        statusText: statusLabelMap[e.status || "todo"]
      });
    });
    items.sort((a,b)=>a.sortOrder-b.sortOrder);
    const total = counts.aankomst + counts.vertrek + counts.wissel;
    const label = dayNames[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()];
    html += `
      <div class="prognose-row${total>0 ? ' prognose-row-clickable' : ''}" ${total>0 ? `data-day="${dKey}"` : ''}>
        <div class="prognose-day">${label}${i===0 ? '<span class="today-pill">Vandaag</span>' : ''}</div>
        ${total === 0
          ? '<div class="prognose-empty">Geen aankomst, vertrek of wissel</div>'
          : `<div class="prognose-badges">
              <span class="badge badge-a">${counts.aankomst} Aankomst</span>
              <span class="badge badge-v">${counts.vertrek} Vertrek</span>
              <span class="badge badge-w">${counts.wissel} Wissel</span>
            </div>`}
      </div>
    `;
    if(total > 0){
      html += `
        <div class="prognose-detail" id="prognose-detail-${dKey}" style="display:none;">
          <ul class="prognose-detail-list">
            ${items.map(it=>`
              <li>
                <span class="prognose-detail-name">${escapeHtml(it.name)}</span>
                <span class="badge ${it.codeText.startsWith('Wissel')?'badge-w':it.codeText.startsWith('Vertrek')?'badge-v':'badge-a'}">${it.codeText}</span>
                <span class="prognose-detail-meta">${escapeHtml(it.assignee)}</span>
                <span class="badge status-badge-${it.statusKey}">${it.statusText}</span>
              </li>
            `).join("")}
          </ul>
        </div>
      `;
    }
  }
  main.innerHTML = html;
  const prognoseLiveSync = document.getElementById('prognoseLiveSyncBtn');
  if(prognoseLiveSync){
    prognoseLiveSync.addEventListener('click', fetchLiveDay);
  }
  document.querySelectorAll('.prognose-row-clickable').forEach(row=>{
    row.addEventListener('click', ()=>{
      const dKey = row.dataset.day;
      const detail = document.getElementById('prognose-detail-'+dKey);
      if(detail){
        detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
      }
    });
  });
}

function renderTimelineGroups(){
  const groups = { W: [], V: [], A: [], none: [] };
  state.accommodations.forEach(name=>{
    const e = getEntry("accom:"+name);
    const key = e.arrival === "W" ? "W" : (e.arrival === "V" || e.arrival === "LU") ? "V" : (e.arrival === "A" || e.arrival === "VI") ? "A" : "none";
    groups[key].push(name);
  });
  const sections = [
    { key:"W", title:"Wissel vandaag", hint:"zelfde dag schoon voor nieuwe gast" },
    { key:"V", title:"Vertrek vandaag", hint:"" },
    { key:"A", title:"Aankomst vandaag", hint:"" },
  ];
  let html = "";
  sections.forEach(s=>{
    if(groups[s.key].length === 0) return;
    html += `<div class="timeline-heading">${s.title}${s.hint ? ` <span class="timeline-hint">${s.hint}</span>` : ""}</div>`;
    html += groups[s.key].map(name=>renderItemCard("accom", name)).join("");
  });
  if(groups.none.length > 0){
    html += `<div class="timeline-heading timeline-heading-muted">Geen aankomst of vertrek vandaag</div>`;
    html += `<div class="timeline-muted-group">` + groups.none.map(name=>renderItemCard("accom", name)).join("") + `</div>`;
  }
  return html;
}

async function fetchLiveForDateKey(dKey){
  const url = `${getApiUrl()}/day/${dKey}?key=${encodeURIComponent(getApiKey()||"")}`;
  const res = await fetch(url);
  if(!res.ok){
    throw new Error("status " + res.status);
  }
  const data = await res.json();
  if(!state.allDays[dKey]) state.allDays[dKey] = {};
  const dayData = state.allDays[dKey];
  (data.items||[]).forEach(item=>{
    const id = "accom:"+item.accommodatie;
    const cur = dayData[id] || { arrival:"", assignee:"", status:"todo", note:"", linen:"onbekend" };
    dayData[id] = Object.assign({}, cur, { arrival: item.code });
  });
  if(dKey === dateKey(state.currentDate)){
    state.dayData = dayData;
  }
  return (data.items||[]).length;
}

async function fetchLiveDay(){
  if(!getApiKey()){
    showToast("Nog geen toegangssleutel ingesteld, zie Admin tab");
    return;
  }
  showToast("Komende 10 dagen live ophalen…");
  let total = 0;
  for(let i=0;i<10;i++){
    const d = new Date(state.currentDate);
    d.setDate(d.getDate()+i);
    try{
      total += await fetchLiveForDateKey(dateKey(d));
    }catch(err){
      // ga door met de rest ook als één dag mislukt
    }
  }
  await doPersistAllDays();
  showToast(`Komende 10 dagen bijgewerkt, ${total} keer een aankomst, vertrek of wissel gezet`);
  renderMain();
}

function attachItemHandlers(){
  const liveSync = document.getElementById('liveSyncBtn');
  if(liveSync){
    liveSync.addEventListener('click', fetchLiveDay);
  }
  document.querySelectorAll('.arrival-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const code = btn.dataset.arrival;
      const cur = getEntry(id);
      setEntry(id, { arrival: cur.arrival === code ? "" : code });
      renderMain();
    });
  });
  document.querySelectorAll('.linen-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      setEntry(btn.dataset.id, { linen: btn.dataset.linen });
      renderMain();
    });
  });
  document.querySelectorAll('.status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const newStatus = btn.dataset.status;
      setEntry(btn.dataset.id, {
        status: newStatus,
        changedBy: getMyName() || "Onbekend",
        changedAt: new Date().toISOString()
      });
      renderMain();
      if(newStatus === 'klaar' || newStatus === 'gecheckt'){
        document.querySelectorAll('.card').forEach(c=>{
          const b = c.querySelector(`.status-btn[data-id="${CSS.escape(btn.dataset.id)}"].active-${newStatus}`);
          if(b){
            const dot = c.querySelector('.status-dot');
            if(dot){ dot.classList.add('pop'); dot.addEventListener('animationend', ()=>dot.classList.remove('pop'), {once:true}); }
            b.classList.add('pop');
            b.addEventListener('animationend', ()=>b.classList.remove('pop'), {once:true});
          }
        });
      }
    });
  });
  document.querySelectorAll('.assignee-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      setEntry(sel.dataset.id, { assignee: sel.value });
    });
  });
  document.querySelectorAll('[data-action="toggle-note"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      state.openNotes[id] = !state.openNotes[id];
      renderMain();
    });
  });
  document.querySelectorAll('[data-action="note"]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      setEntry(inp.dataset.id, { note: inp.value });
    });
  });
}

function renderAdminTab(main){

    <div class="sync-intro" style="margin-bottom:12px;">

    </div>
    <div class="quick-sync-row" style="display:flex;">
      <button id="topIcsBtn" class="quick-sync-btn">Ververs met iCal</button>
      <button id="topLiveSyncBtn" class="quick-sync-btn live-sync-btn">Ververs live</button>
    </div>
    <div class="section-label" style="margin-top:0;">Serverkoppeling</div>
    <div class="sync-box">
      <div class="sync-intro" style="margin-bottom:10px;">
        Adres en toegangssleutel van de server die zowel de Tommy koppeling als alle gedeelde gegevens van deze app bijhoudt, accommodaties, team, taken en de dagelijkse status. Wordt per apparaat onthouden, dus dit moet je op elk nieuw apparaat of nieuwe browser eenmalig invullen.
      </div>
      <input type="text" id="liveUrl" class="add-row-input" placeholder="https://mariahoeve-tommy-live.onrender.com" value="${escapeAttr(getApiUrl()||'')}" style="width:100%; margin-bottom:8px; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:13px;">
      <input type="text" id="liveKey" class="add-row-input" placeholder="Toegangssleutel" value="${escapeAttr(getApiKey()||'')}" style="width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:13px;">
      <div class="sync-actions">
        <button id="saveLiveBtn">Opslaan</button>
      </div>
    </div>

    <div class="section-label">Managercode</div>
    <div class="sync-box">
      <div class="sync-intro" style="margin-bottom:10px;">
        Deze code moet ingevoerd worden om medewerkers aan een accommodatie toe te wijzen. Iedereen kan de status nog gewoon wijzigen, schoonmaak, klaar, gecheckt, dat blijft altijd open.
      </div>
      <input type="text" id="managerPinInput" class="add-row-input" placeholder="0000" maxlength="4" value="${escapeAttr(state.managerPin||'')}" style="width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:13px;">
      <div class="sync-actions">
        <button id="saveManagerPinBtn">Opslaan</button>
      </div>
    </div>

    <div class="section-label">iCal sync, reservekopie</div>
    <div class="sync-intro">
      Upload hier het .ics bestand dat je bij Tommy hebt gedownload, of plak de inhoud. Alleen nodig als de live koppeling hierboven een keer niet beschikbaar is. Zodra het bestand er staat, zoekt de app voor de op dit moment geselecteerde dag (${escapeHtml(dayLabelText(state.currentDate))}) welke accommodaties aankomst, vertrek of wissel hebben, en vult dat meteen in bij de aankomst code van elke accommodatie. Bestaande handmatige codes voor die dag worden overschreven voor accommodaties die in het bestand voorkomen.
    </div>
    <div class="sync-box">
      <input type="file" id="icsFile" accept=".ics,text/calendar">
      <textarea id="icsText" placeholder="Of plak hier de inhoud van het .ics bestand"></textarea>
      <div class="sync-actions">
        <button class="secondary" id="clearSyncBtn">Wissen</button>
      </div>
    </div>
    <div id="syncResult"></div>
  `;
  document.getElementById('saveLiveBtn').addEventListener('click', async ()=>{
    const url = document.getElementById('liveUrl').value.trim().replace(/\/$/, "");
    const key = document.getElementById('liveKey').value.trim();
    setApiSettings(url, key);
    showToast("Instellingen opgeslagen op dit apparaat");
    renderMain();
  });
  document.getElementById('saveManagerPinBtn').addEventListener('click', async ()=>{
    const pin = document.getElementById('managerPinInput').value.trim();
    if(!/^\d{4}$/.test(pin)){
      showToast("Gebruik precies vier cijfers");
      return;
    }
    state.managerPin = pin;
    await saveList("manager-pin", pin);
    showToast("Managercode opgeslagen");
  });
  document.getElementById('topIcsBtn').addEventListener('click', ()=>{
    document.getElementById('icsFile').click();
  });
  const topLiveSyncBtn = document.getElementById('topLiveSyncBtn');
  if(topLiveSyncBtn){
    topLiveSyncBtn.addEventListener('click', fetchLiveDay);
  }
  document.getElementById('icsFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      document.getElementById('icsText').value = reader.result;
      processAndApply(reader.result);
    };
    reader.readAsText(file);
  });
  document.getElementById('clearSyncBtn').addEventListener('click', ()=>{
    document.getElementById('icsText').value = "";
    document.getElementById('syncResult').innerHTML = "";
  });
  document.getElementById('icsText').addEventListener('paste', (e)=>{
    setTimeout(()=>{
      processAndApply(document.getElementById('icsText').value);
    }, 0);
  });
}


function parseIcs(text){
  const events = [];
  const blocks = text.split("BEGIN:VEVENT").slice(1);
  blocks.forEach(block=>{
    const summaryMatch = block.match(/SUMMARY:([^\r\n]*)/);
    const startMatch = block.match(/DTSTART[^:]*:(\d{8})/);
    const endMatch = block.match(/DTEND[^:]*:(\d{8})/);
    if(summaryMatch && startMatch && endMatch){
      events.push({
        name: summaryMatch[1].trim(),
        start: startMatch[1],
        end: endMatch[1]
      });
    }
  });
  return events;
}

function icsDateForCurrent(){
  const d = state.currentDate;
  return "" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
}

let lastSyncResult = null;

function computeSync(events){
  const target = icsDateForCurrent();
  const knownNames = state.accommodations;
  const knownLower = knownNames.map(n=>n.toLowerCase());
  const perAccom = {};
  events.forEach(ev=>{
    const idx = knownLower.indexOf(ev.name.toLowerCase());
    if(idx === -1) return;
    const realName = knownNames[idx];
    if(!perAccom[realName]) perAccom[realName] = { arrival:false, departure:false };
    if(ev.start === target) perAccom[realName].arrival = true;
    if(ev.end === target) perAccom[realName].departure = true;
  });
  const matched = Object.keys(perAccom).map(name=>{
    const f = perAccom[name];
    let code = "";
    if(f.arrival && f.departure) code = "W";
    else if(f.arrival) code = "A";
    else if(f.departure) code = "V";
    return { name, code };
  }).filter(m=>m.code);
  const eventNames = Array.from(new Set(events.map(e=>e.name)));
  const unmatched = eventNames.filter(n=>knownLower.indexOf(n.toLowerCase()) === -1);
  return { matched, unmatched };
}

function processAndApply(text){
  if(!text || text.indexOf("VEVENT") === -1){
    showToast("Geen geldige iCal inhoud gevonden");
    return;
  }
  const events = parseIcs(text);
  const result = computeSync(events);
  result.matched.forEach(m=>{
    setEntry("accom:"+m.name, { arrival: m.code });
  });
  showToast(result.matched.length ? "Aankomst codes automatisch ingevuld" : "Verwerkt, niets gevonden voor deze dag");
  renderSyncResult(result);
}

function renderSyncResult(result){
  const el = document.getElementById('syncResult');
  if(!el) return;
  if(result.matched.length === 0){
    el.innerHTML = '<div class="empty">Geen aankomsten, vertrekken of wissels gevonden voor deze dag in het bestand.</div>';
    return;
  }
  const badgeClass = { A:"badge-a", V:"badge-v", W:"badge-w" };
  const badgeLabel = { A:"Aankomst", V:"Vertrek", W:"Wissel" };
  el.innerHTML = `
    <div class="sync-box">
      <div class="section-label" style="margin-top:0;">Automatisch ingevuld bij Accommodaties</div>
      <ul class="match-list">
        ${result.matched.map(m=>`<li>${escapeHtml(m.name)}<span class="badge ${badgeClass[m.code]}">${badgeLabel[m.code]}</span></li>`).join("")}
      </ul>
      ${result.unmatched.length ? `<div class="unmatched">Niet gekoppeld, staan niet in de accommodatielijst: ${result.unmatched.map(escapeHtml).join(", ")}</div>` : ""}
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById('prevDay').addEventListener('click', ()=>switchDay(-1));
document.getElementById('nextDay').addEventListener('click', ()=>switchDay(1));
document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  document.getElementById('main').innerHTML = '<div class="loading">Vernieuwen…</div>';
  await init();
  showToast("Vernieuwd");
});
document.getElementById('lockToggle').addEventListener('click', ()=>{
  if(state.managerUnlocked){
    state.managerUnlocked = false;
    updateLockIcon();
    renderMain();
    showToast("Vergrendeld");
    return;
  }
  const code = window.prompt("Voer de viercijferige managercode in:");
  if(code === null) return;
  if(code.trim() === state.managerPin){
    state.managerUnlocked = true;
    updateLockIcon();
    renderMain();
    showToast("Ontgrendeld voor deze sessie");
  } else {
    showToast("Onjuiste code");
  }
});
function updateLockIcon(){
  const btn = document.getElementById('lockToggle');
  if(!btn) return;
  btn.textContent = state.managerUnlocked ? "🔓" : "🔒";
  btn.title = state.managerUnlocked ? "Manager vergrendelen" : "Manager ontgrendelen";
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.currentTab = btn.dataset.tab;
    renderMain();
  });
});

init();
</script>
